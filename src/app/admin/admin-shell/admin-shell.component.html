<div class="shell">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__emoji" aria-hidden="true">🛠️</span>
      <span class="topbar__title">PapaToGo · Admin-Stübli</span>
    </div>

    <div class="topbar__user">
      @if (user()?.email; as email) {
        <span class="topbar__email" title="Aagmäldet als">{{ email }}</span>
      }
      <ptg-button variant="ghost" (click)="logout()">Uslogge</ptg-button>
    </div>
  </header>

  <nav class="nav" aria-label="Admin-Navigation">
    <a class="nav__link" routerLink="/admin/kategorien" routerLinkActive="nav__link--active">
      🗂️ Kategorie
    </a>
    <a class="nav__link" routerLink="/admin/artikel" routerLinkActive="nav__link--active">
      🎁 Artikel
    </a>
    <a class="nav__link" routerLink="/admin/geraet" routerLinkActive="nav__link--active">
      📲 Handy aamälde
    </a>
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
