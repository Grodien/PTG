<header class="app-header">
  <a class="app-header__brand" routerLink="/">
    <span class="app-header__logo" aria-hidden="true">💗</span>
    <span class="app-header__title">Papa-to-Go</span>
  </a>

  <nav class="app-header__nav" aria-label="Hauptnavigation">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      Lädeli
    </a>
    <a
      class="app-header__cart"
      routerLink="/warenkorb"
      routerLinkActive="is-active"
      [attr.aria-label]="'Warenkorb, ' + cartCount() + ' Artikel'"
    >
      Warächorb 🛒
      @if (cartCount() > 0) {
        <span class="app-header__badge" aria-hidden="true">{{ cartCount() }}</span>
      }
    </a>
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <span class="app-footer__note">Mit ❤️ gmacht · zahlbar i Müntschis</span>
  <a class="app-footer__admin" routerLink="/admin" aria-label="Admin-Bereich">
    Admin
  </a>
</footer>
